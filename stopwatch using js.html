<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
</head>
<body>

    <div class="wrapper">
        <h1><mark>Stopwatch</mark></h1>

        <p>
            <span id="second">00</span>:<span id="milliseconds">00</span>
        </p>

        <button id="button-start">Start</button>
        <button id="button-stop">Stop</button>
        <button id="button-reset">Reset</button>
    </div>

    <script src="stopwatch using.js"></script>
</body>
</html>
